name: Browser edition

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tests/test_browser_static.py"
      - "tests/web_editor.test.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "tests/test_browser_static.py"
      - "tests/web_editor.test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test browser editor rules
        run: node --test tests/web_editor.test.mjs
      - name: Test static privacy contract
        run: python tests/test_browser_static.py
      - uses: actions/configure-pages@v5
      - name: Upload browser edition
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
