name: Browser edition

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tests/test_browser_static.py"
      - "tests/web_editor.test.mjs"
      - "tests/web_standalone.test.mjs"
      - "scripts/build_browser_standalone.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "tests/test_browser_static.py"
      - "tests/web_editor.test.mjs"
      - "tests/web_standalone.test.mjs"
      - "scripts/build_browser_standalone.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test browser editor rules
        run: node --test tests/web_editor.test.mjs tests/web_standalone.test.mjs
      - name: Test static privacy contract
        run: python tests/test_browser_static.py
      - name: Verify generated offline browser edition
        run: python scripts/build_browser_standalone.py --check

  pages_status:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        name: Check GitHub Pages configuration
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const response = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              if (response.data.build_type !== "workflow") {
                core.setOutput("enabled", "false");
                core.notice(
                  "GitHub Pages is enabled but not configured for GitHub Actions. " +
                    "Browser verification passed; deployment was skipped. Set " +
                    "Settings > Pages > Source to GitHub Actions to publish."
                );
                return;
              }
              core.setOutput("enabled", "true");
              core.notice("GitHub Pages is configured for GitHub Actions; deployment will run.");
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("enabled", "false");
                core.notice(
                  "GitHub Pages is not configured. Browser verification passed; deployment " +
                    "was skipped. Set Settings > Pages > Source to GitHub Actions to publish."
                );
                return;
              }
              throw error;
            }

  prepare_pages:
    if: needs.pages_status.outputs.enabled == 'true'
    needs: pages_status
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Upload browser edition
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [pages_status, prepare_pages]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
