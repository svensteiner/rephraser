name: Windows Portable

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packaging/**"
      - "web/**"
      - "scripts/build_browser_standalone.py"
      - "pyproject.toml"
      - "SCHNELLSTART.md"
      - "tests/test_browser_static.py"
      - "tests/web_editor.test.mjs"
      - "tests/web_standalone.test.mjs"
      - ".github/workflows/windows-portable.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build dependencies
        run: python -m pip install . pyinstaller==6.16.0
      - name: Verify offline browser edition
        run: |
          python scripts/build_browser_standalone.py --check
          # Re-write with canonical LF line endings so the downloadable asset
          # has the same content hash regardless of the Windows checkout mode.
          python scripts/build_browser_standalone.py
          node --test tests/web_editor.test.mjs tests/web_standalone.test.mjs
          python tests/test_browser_static.py
      - name: Run desktop self-test
        run: python -m app.desktop --self-test
      - name: Build portable application
        run: pyinstaller --noconfirm --clean packaging/TextVerbessern.spec
      - name: Test packaged application
        shell: pwsh
        run: |
          $expectedVersion = python -c "from app import __version__; print(__version__)"
          $exePath = (Resolve-Path '.\dist\TextVerbessern\TextVerbessern.exe').Path
          $versionInfo = (Get-Item -LiteralPath $exePath).VersionInfo
          if ($versionInfo.ProductVersion -ne $expectedVersion) {
            throw "ProductVersion mismatch: $($versionInfo.ProductVersion) != $expectedVersion"
          }
          if ($versionInfo.ProductName -ne 'Editorial Transformer') {
            throw "ProductName metadata is missing"
          }
          $info = [System.Diagnostics.ProcessStartInfo]::new()
          $info.FileName = $exePath
          $info.Arguments = '--self-test'
          $info.UseShellExecute = $false
          $info.CreateNoWindow = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $info
          if (-not $process.Start()) { throw "Packaged application did not start" }
          $started = [System.Diagnostics.Stopwatch]::StartNew()
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "Packaged self-test timed out"
          }
          $started.Stop()
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed" }
          Write-Host "Packaged startup+self-test: $([math]::Round($started.Elapsed.TotalSeconds, 2)) s"
      - name: Create download archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item dist\TextVerbessern\* portable -Recurse -Force
          Copy-Item SCHNELLSTART.md portable\SCHNELLSTART.md
          Copy-Item web\TextVerbessern-Browser.html portable\TextVerbessern-Browser.html
          $version = python -c "from app import __version__; print(__version__)"
          Set-Content portable\VERSION.txt -Value $version -Encoding UTF8
          @"
          TEXT VERBESSERN – PORTABLE VERSION

          1. TextVerbessern.exe doppelklicken.
          2. Text einfügen.
          3. Text verbessern anklicken.
          4. Ergebnis kopieren.

          "Schnell verbessern" funktioniert sofort und ohne Installation.
          "Gründlich mit Mistral" ist optional und benötigt ein lokal laufendes Ollama-Modell.
          Es gibt keinen Cloud-Fallback.

          Ohne EXE kann alternativ TextVerbessern-Browser.html direkt mit einem Browser
          geöffnet werden. Diese Datei arbeitet lokal und benötigt keinen Server.
          "@ | Set-Content portable\STARTEN.txt -Encoding UTF8
          $files = Get-ChildItem portable -Recurse -File | ForEach-Object {
            [ordered]@{
              path = [IO.Path]::GetRelativePath((Resolve-Path portable), $_.FullName).Replace('\', '/')
              bytes = $_.Length
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{
            version = $version
            commit = $env:GITHUB_SHA
            built_utc = [DateTime]::UtcNow.ToString('o')
            files = @($files)
          } | ConvertTo-Json -Depth 5 | Set-Content portable\release-manifest.json -Encoding UTF8
          Compress-Archive -Path portable\* -DestinationPath TextVerbessern-Windows.zip -Force
          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath TextVerbessern-Windows.zip).Hash.ToLowerInvariant()
          $browserHash = (Get-FileHash -Algorithm SHA256 -LiteralPath web\TextVerbessern-Browser.html).Hash.ToLowerInvariant()
          @(
            "$zipHash  TextVerbessern-Windows.zip"
            "$browserHash  TextVerbessern-Browser.html"
          ) | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Verify exact downloadable archive
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath TextVerbessern-Windows.zip -DestinationPath archive-check
          $root = (Resolve-Path archive-check).Path
          $manifestPath = Join-Path $root 'release-manifest.json'
          $manifest = Get-Content -Raw -Encoding UTF8 -LiteralPath $manifestPath | ConvertFrom-Json
          $expectedVersion = python -c "from app import __version__; print(__version__)"
          if ($manifest.version -ne $expectedVersion) {
            throw "Archive version mismatch: $($manifest.version) != $expectedVersion"
          }
          if ($manifest.commit -ne $env:GITHUB_SHA) {
            throw "Archive commit mismatch: $($manifest.commit) != $env:GITHUB_SHA"
          }
          foreach ($entry in $manifest.files) {
            $relative = [string]$entry.path
            $components = $relative -split '[/\\]'
            if ([IO.Path]::IsPathRooted($relative) -or '..' -in $components -or $relative.Contains(':')) {
              throw "Unsafe manifest path: $relative"
            }
            $candidate = [IO.Path]::GetFullPath((Join-Path $root $relative))
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "Archive file missing: $relative"
            }
            $file = Get-Item -LiteralPath $candidate
            if ($file.Length -ne [long]$entry.bytes) {
              throw "Archive size mismatch: $relative"
            }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidate).Hash.ToLowerInvariant()
            if ($hash -ne [string]$entry.sha256) {
              throw "Archive hash mismatch: $relative"
            }
          }
          foreach ($required in @('TextVerbessern.exe', 'TextVerbessern-Browser.html', 'VERSION.txt', 'STARTEN.txt', 'SCHNELLSTART.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $required) -PathType Leaf)) {
              throw "Required download file missing: $required"
            }
          }
          $exePath = Join-Path $root 'TextVerbessern.exe'
          $process = Start-Process -FilePath $exePath -ArgumentList '--self-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Extracted application self-test timed out'
          }
          if ($process.ExitCode -ne 0) { throw 'Extracted application self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: TextVerbessern-Windows
          path: |
            TextVerbessern-Windows.zip
            web\TextVerbessern-Browser.html
            SHA256SUMS.txt
          retention-days: 30
      - name: Publish immutable version release
        id: publish_immutable
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from app import __version__; print(__version__)"
          $versionTag = "v$version"
          # A release already bound to this exact commit is the durable source
          # of truth on a workflow re-run.  The ZIP intentionally contains a
          # build timestamp, so a freshly rebuilt ZIP need not have its hash.
          $releaseAssetSource = "local"

          function Resolve-TagCommit([string]$tag) {
            $reference = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>$null
            $referenceExit = $LASTEXITCODE
            if ($referenceExit -eq 1) { return $null }
            if ($referenceExit -ne 0) { throw "Could not read tag $tag" }
            $object = ($reference | ConvertFrom-Json).object
            while ([string]$object.type -eq 'tag') {
              $tagObjectJson = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)"
              if ($LASTEXITCODE -ne 0) { throw "Could not resolve tag $tag" }
              $object = ($tagObjectJson | ConvertFrom-Json).object
            }
            if ([string]$object.type -ne 'commit') {
              throw "Tag $tag does not resolve to a commit."
            }
            return [string]$object.sha
          }

          $existingTagCommit = Resolve-TagCommit $versionTag
          if ($null -ne $existingTagCommit -and $existingTagCommit -ne $env:GITHUB_SHA) {
            throw "Version $versionTag already targets $existingTagCommit, not $env:GITHUB_SHA. Refusing to replace an immutable release."
          }

          $existingRelease = gh release view $versionTag --json isDraft,isPrerelease 2>$null
          $existingReleaseExit = $LASTEXITCODE
          if ($existingReleaseExit -eq 0) {
            if ($null -eq $existingTagCommit -or $existingTagCommit -ne $env:GITHUB_SHA) {
              throw "Existing release $versionTag is not bound to $env:GITHUB_SHA."
            }
            $releaseMetadata = $existingRelease | ConvertFrom-Json
            if ($releaseMetadata.isDraft -or $releaseMetadata.isPrerelease) {
              throw "Existing $versionTag is not a standard published immutable version release."
            }
            $releaseAssetSource = "immutable"
          } elseif ($existingReleaseExit -eq 1) {
            gh release create $versionTag TextVerbessern-Windows.zip web\TextVerbessern-Browser.html SHA256SUMS.txt `
              --target "$env:GITHUB_SHA" `
              --title "Text verbessern v$version" `
              --notes "Unveränderliche lokale Windows-Version für Commit $env:GITHUB_SHA. SHA256SUMS.txt prüft beide Downloads. Kein Cloud-Fallback."
            if ($LASTEXITCODE -ne 0) { throw "Could not create immutable version release $versionTag." }
          } else {
            throw "Could not inspect release $versionTag."
          }

          $publishedTagCommit = Resolve-TagCommit $versionTag
          if ($publishedTagCommit -ne $env:GITHUB_SHA) {
            throw "Immutable version tag $versionTag does not target $env:GITHUB_SHA."
          }
          "release_asset_source=$releaseAssetSource" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify published immutable version release
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_SOURCE: ${{ steps.publish_immutable.outputs.release_asset_source }}
        run: |
          $version = python -c "from app import __version__; print(__version__)"
          $versionTag = "v$version"
          $releaseMetadata = gh release view $versionTag --json isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not verify immutable release $versionTag." }
          if ($releaseMetadata.isDraft -or $releaseMetadata.isPrerelease) {
            throw "$versionTag must be a standard published version release."
          }
          $directory = 'published-check\immutable'
          $assetDirectory = 'release-assets'
          New-Item -ItemType Directory -Force -Path $directory, $assetDirectory | Out-Null
          gh release download $versionTag `
            --pattern TextVerbessern-Windows.zip `
            --pattern TextVerbessern-Browser.html `
            --pattern SHA256SUMS.txt `
            --dir $directory `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download immutable release $versionTag." }
          $publishedZipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$directory\TextVerbessern-Windows.zip").Hash.ToLowerInvariant()
          $publishedBrowserHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$directory\TextVerbessern-Browser.html").Hash.ToLowerInvariant()
          $checksums = Get-Content -LiteralPath "$directory\SHA256SUMS.txt"
          if ($checksums -notcontains "$publishedZipHash  TextVerbessern-Windows.zip") { throw 'Immutable SHA256SUMS does not match the ZIP download.' }
          if ($checksums -notcontains "$publishedBrowserHash  TextVerbessern-Browser.html") { throw 'Immutable SHA256SUMS does not match the browser download.' }
          if ($env:RELEASE_ASSET_SOURCE -eq 'local') {
            # Only a release created in this run is compared with the fresh
            # local build.  A later run uses the previously verified immutable
            # files because the ZIP's build timestamp is intentionally variable.
            $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath TextVerbessern-Windows.zip).Hash.ToLowerInvariant()
            $browserHash = (Get-FileHash -Algorithm SHA256 -LiteralPath web\TextVerbessern-Browser.html).Hash.ToLowerInvariant()
            if ($publishedZipHash -ne $zipHash) { throw "Immutable ZIP hash mismatch: $publishedZipHash != $zipHash" }
            if ($publishedBrowserHash -ne $browserHash) { throw "Immutable browser file hash mismatch: $publishedBrowserHash != $browserHash" }
          } elseif ($env:RELEASE_ASSET_SOURCE -ne 'immutable') {
            throw "Unknown immutable release asset source: $env:RELEASE_ASSET_SOURCE"
          }
          Copy-Item "$directory\TextVerbessern-Windows.zip", "$directory\TextVerbessern-Browser.html", "$directory\SHA256SUMS.txt" -Destination $assetDirectory -Force
      - name: Update portable-latest convenience release
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from app import __version__; print(__version__)"
          $notes = "Beweglicher Download-Link auf die unveränderliche Version v$version. Für einen reproduzierbaren Bezug bitte v$version verwenden. Keine Installation und kein Cloud-Fallback."
          $assetDirectory = 'release-assets'
          $zip = Join-Path $assetDirectory 'TextVerbessern-Windows.zip'
          $browser = Join-Path $assetDirectory 'TextVerbessern-Browser.html'
          $checksums = Join-Path $assetDirectory 'SHA256SUMS.txt'
          foreach ($asset in @($zip, $browser, $checksums)) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Verified immutable release asset is missing: $asset"
            }
          }
          gh release view portable-latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/git/refs/tags/portable-latest" `
              -f sha="$env:GITHUB_SHA" -F force=true | Out-Null
            gh release upload portable-latest $zip $browser $checksums --clobber
          } else {
            gh release create portable-latest $zip $browser $checksums `
              --target "$env:GITHUB_SHA" `
              --prerelease `
              --title "Text verbessern – aktueller Windows-Download" `
              --notes "Portable, lokale Windows-Version. Keine Installation und kein Cloud-Fallback."
          }
          gh release edit portable-latest `
            --prerelease `
            --title "Text verbessern – aktueller Download (v$version)" `
            --notes "$notes"
      - name: Verify published portable-latest download
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $reference = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/portable-latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify portable-latest tag.' }
          if ([string]$reference.object.type -ne 'commit' -or [string]$reference.object.sha -ne $env:GITHUB_SHA) {
            throw "portable-latest does not target $env:GITHUB_SHA."
          }
          $directory = 'published-check\portable-latest'
          $assetDirectory = 'release-assets'
          New-Item -ItemType Directory -Force $directory | Out-Null
          gh release download portable-latest `
            --pattern TextVerbessern-Windows.zip `
            --pattern TextVerbessern-Browser.html `
            --pattern SHA256SUMS.txt `
            --dir $directory `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download portable-latest release assets.' }
          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$assetDirectory\TextVerbessern-Windows.zip").Hash.ToLowerInvariant()
          $browserHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$assetDirectory\TextVerbessern-Browser.html").Hash.ToLowerInvariant()
          $publishedZipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$directory\TextVerbessern-Windows.zip").Hash.ToLowerInvariant()
          $publishedBrowserHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$directory\TextVerbessern-Browser.html").Hash.ToLowerInvariant()
          if ($publishedZipHash -ne $zipHash) { throw "portable-latest ZIP hash mismatch: $publishedZipHash != $zipHash" }
          if ($publishedBrowserHash -ne $browserHash) { throw "portable-latest browser file hash mismatch: $publishedBrowserHash != $browserHash" }
          $checksums = Get-Content -LiteralPath "$directory\SHA256SUMS.txt"
          if ($checksums -notcontains "$zipHash  TextVerbessern-Windows.zip") { throw 'portable-latest SHA256SUMS does not match the ZIP download.' }
          if ($checksums -notcontains "$browserHash  TextVerbessern-Browser.html") { throw 'portable-latest SHA256SUMS does not match the browser download.' }
